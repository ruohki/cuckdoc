<title>Page not found — Cuckdoc</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    --ground:#EEF0F4;
    --panel:#FFFFFF;
    --ink:#131822;
    --ink-2:#414B5A;
    --muted:#6C7787;
    --rule:#D3DAE4;
    --accent:#2D5BD7;
    --accent-ink:#FFFFFF;
    --accent-hover:#2349B4;
    --shadow:0 1px 2px rgba(19,24,34,.08), 0 14px 34px -14px rgba(19,24,34,.30);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0C1117;
      --panel:#141C26;
      --ink:#E6ECF4;
      --ink-2:#B4C0CE;
      --muted:#8A97A7;
      --rule:#25303D;
      --accent:#6E97F5;
      --accent-ink:#0A1120;
      --accent-hover:#88AAFA;
      --shadow:0 1px 2px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0C1117;
    --panel:#141C26;
    --ink:#E6ECF4;
    --ink-2:#B4C0CE;
    --muted:#8A97A7;
    --rule:#25303D;
    --accent:#6E97F5;
    --accent-ink:#0A1120;
    --accent-hover:#88AAFA;
    --shadow:0 1px 2px rgba(0,0,0,.55), 0 18px 40px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .four{
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding-inline:16px;
    padding-block:48px;
  }
  .card{
    width:min(100%,460px);
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:30px 30px 26px;
    box-shadow:var(--shadow);
  }
  .mark{
    display:grid;place-items:center;
    width:34px;height:34px;
    border-radius:8px;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:13px;font-weight:500;letter-spacing:-.02em;
    margin-bottom:20px;
  }
  .code{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10px;font-weight:500;
    text-transform:uppercase;letter-spacing:.14em;
    color:var(--muted);
    margin:0 0 6px;
  }
  h1{
    margin:0 0 10px;
    font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
    text-wrap:balance;
  }
  p{margin:0 0 14px;font-size:13.5px;line-height:1.6;color:var(--ink-2);max-width:56ch}
  .path{
    display:block;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px;
    color:var(--ink);
    background:var(--ground);
    border:1px solid var(--rule);
    border-radius:7px;
    padding:8px 10px;
    margin:0 0 20px;
    overflow-wrap:break-word;
  }
  .home{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--accent);
    color:var(--accent-ink);
    border-radius:8px;
    padding:10px 16px;
    font-size:14px;font-weight:600;
    text-decoration:none;
    transition:background .12s ease;
  }
  .home:hover{background:var(--accent-hover)}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

<div class="four">
  <main class="card">
    <div class="mark" aria-hidden="true">md</div>
    <p class="code">Error 404</p>
    <h1>There's no page here</h1>
    <p>Cuckdoc is a single page: you paste markdown on the left and copy Word-ready
       rich text from the right. Whatever link brought you here points at something
       this site doesn't serve.</p>
    <code class="path" id="path">&nbsp;</code>
    <a class="home" href="/">Open the converter</a>
  </main>
</div>

<script>
  (function(){
    var el = document.getElementById('path');
    try {
      el.textContent = location.pathname + location.search;
    } catch(e){
      el.hidden = true;
    }
  })();
</script>
